# ─────────────────────────────────────────────
# GastroFlow — CI/CD Pipeline (SDD)
# Spec-Driven Development: lint → test → build → validate specs → deploy
# ─────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  # ════════════════════════════════════════════
  # Stage 1: Lint & Type Check
  # ════════════════════════════════════════════
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (backend)
        run: npx tsc --noEmit

      - name: ESLint (backend)
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

  # ════════════════════════════════════════════
  # Stage 2: Unit Tests
  # ════════════════════════════════════════════
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ════════════════════════════════════════════
  # Stage 3: Integration Tests (con PostgreSQL)
  # ════════════════════════════════════════════
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gastroflow
          POSTGRES_PASSWORD: gastroflow
          POSTGRES_DB: gastroflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gastroflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gastroflow:gastroflow@localhost:5432/gastroflow_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed integration database
        run: npm run seed

      - name: Run integration tests
        run: npm run test:integration

  # ════════════════════════════════════════════
  # Stage 4: Build
  # ════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install & build backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ════════════════════════════════════════════
  # Stage 5: Spec Validation (SDD)
  # ════════════════════════════════════════════
  spec-validation:
    name: Spec Validation (SDD)
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate spec coverage
        run: npm run spec:validate

  # ════════════════════════════════════════════
  # Stage 6: Docker Build (solo en main)
  # ════════════════════════════════════════════
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gastroflow-api:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t gastroflow-web:${{ github.sha }} ./frontend

      - name: Test compose up
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose down
